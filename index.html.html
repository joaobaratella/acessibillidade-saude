<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>SaúdeConecta acessível</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: protótipo de celular à esquerda, notas de acessibilidade (WCAG 2.2) à direita; abas do fluxo no topo */
:root{
  --bg:#EAF0F3; --surface:#FFFFFF; --ink:#15232B; --muted:#4B5E69; --line:#C9D5DB;
  --accent:#2B6B8C; --accent-soft:#DCEAF1; --bad:#A8231A; --bad-soft:#FBE9E7; --good:#1D6040; --good-soft:#E2F1E8;
  --font:"Atkinson Hyperlegible", "Segoe UI", Roboto, system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F181D; --surface:#16232B; --ink:#E4EDF1; --muted:#9FB2BC; --line:#2C3D47;
  --accent:#86C3DF; --accent-soft:#1D3542; --bad:#F2958B; --bad-soft:#3A1F1C; --good:#86D3A8; --good-soft:#18322A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F181D; --surface:#16232B; --ink:#E4EDF1; --muted:#9FB2BC; --line:#2C3D47;
  --accent:#86C3DF; --accent-soft:#1D3542; --bad:#F2958B; --bad-soft:#3A1F1C; --good:#86D3A8; --good-soft:#18322A; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;padding:24px 16px 48px}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header.top{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px}
header.top h1{margin:0;font-size:1.6rem;line-height:1.2;text-wrap:balance}
header.top p{margin:4px 0 0;color:var(--muted);max-width:62ch}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.skip{position:absolute;left:-9999px}.skip:focus{left:16px;top:16px;background:var(--surface);padding:8px 12px;z-index:50}

nav.flow ol{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
nav.flow button{font:inherit;font-size:.95rem;min-height:44px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:flex;gap:8px;align-items:center}
nav.flow button .n{font-family:var(--mono);font-size:.8rem;color:var(--muted)}
nav.flow button[aria-current="step"]{border-color:var(--accent);background:var(--accent-soft);font-weight:700}

.wrap{max-width:400px}
nav.flow ol{justify-content:center}
.stage{width:100%}

.side-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{font:inherit;font-size:.9rem;min-height:40px;padding:6px 12px;border:0;background:none;color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface);font-weight:700}
.seg button + button{border-left:1px solid var(--line)}
.lbl{font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-right:6px}

/* ===== Celular (app sempre em tema claro, como no Figma) ===== */
.phone-col{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
@media (max-width:820px){.phone-col{position:static}}
.phone{
  --p-bg:#FFFFFF; --p-ink:#16242C; --p-muted:#475862; --p-brand:#2B6B8C; --p-brand-ink:#FFFFFF; --p-brand-soft:#E2EDF3;
  --p-line:#6E8692; --p-ok-bg:#E3F2E9; --p-ok-ink:#1B5A39; --p-warn-bg:#FFF3D3; --p-warn-ink:#634400;
  --p-err-bg:#FCE8E6; --p-err-ink:#A1190F; --p-dark:#17232B; --p-dark-ink:#FFFFFF;
  font-size:var(--fs,16px);
  background:var(--p-bg);color:var(--p-ink);border:1px solid #B9C7CE;border-radius:28px;
  min-height:740px;position:relative;overflow:hidden;display:flex;flex-direction:column;
  box-shadow:0 1px 0 rgba(0,0,0,.04),0 18px 40px -24px rgba(20,40,55,.45);color-scheme:light;
}
.phone.dark-before{background:#3B4B57}
.status{display:flex;justify-content:space-between;padding:.7em 1.4em .2em;font-size:.75em;font-variant-numeric:tabular-nums}
.brand{display:flex;align-items:center;gap:.55em;padding:.5em 1.25em .3em;font-weight:700;color:var(--p-brand);font-size:1em}
.brand i{width:1.4em;height:1.4em;border-radius:50%;background:var(--p-brand);display:block}
.screen{padding:.6em 1.25em 1.25em;display:flex;flex-direction:column;gap:.85em;flex:1}
.screen h2{font-size:1.55em;line-height:1.2;margin:.15em 0 0;text-wrap:balance}
.screen h2:focus{outline:none}
.screen p{margin:0}
.muted{color:var(--p-muted)}
.note{display:flex;gap:.6em;align-items:flex-start;padding:.7em .85em;border-radius:.6em;font-size:.88em;line-height:1.4}
.note svg{flex:none;width:1.2em;height:1.2em;margin-top:.1em}
.note.ok{background:var(--p-ok-bg);color:var(--p-ok-ink)}
.note.warn{background:var(--p-warn-bg);color:var(--p-warn-ink)}
.note.err{background:var(--p-err-bg);color:var(--p-err-ink)}
.note.info{background:var(--p-brand-soft);color:#1E4F69}
.note button{font:inherit;font-weight:700;color:inherit;background:none;border:0;padding:0;text-decoration:underline;cursor:pointer;min-height:24px}

.btn{font:inherit;font-weight:700;font-size:1em;min-height:3em;width:100%;border-radius:.65em;border:2px solid transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:.5em;padding:.5em 1em;text-align:center}
.btn.primary{background:var(--p-brand);color:var(--p-brand-ink)}
.btn.soft{background:var(--p-brand-soft);color:#1E4F69}
.btn.ghost{background:#fff;color:var(--p-brand);border-color:var(--p-brand)}
.btn.dark{background:var(--p-dark);color:var(--p-dark-ink)}
.btn svg{width:1.15em;height:1.15em;flex:none}
.phone :focus-visible{outline:3px solid #0B5CAD;outline-offset:2px}
.links{display:flex;flex-wrap:wrap;justify-content:center;gap:.2em .9em;font-size:.9em}
.link{font:inherit;color:var(--p-brand);background:none;border:0;text-decoration:underline;text-underline-offset:3px;cursor:pointer;min-height:2.75em;padding:0 .2em}
.dock{display:grid;grid-template-columns:1fr 1fr;gap:.6em;margin-top:auto;padding-top:.6em}

/* OTP */
.otp{display:grid;grid-template-columns:repeat(6,1fr);gap:.45em;border:0;margin:0;padding:0}
.otp legend{font-size:.9em;margin-bottom:.4em;font-weight:700}
.otp input{width:100%;min-width:0;height:3.1em;border:2px solid var(--p-line);border-radius:.55em;text-align:center;font:inherit;font-size:1.35em;font-weight:700;color:var(--p-ink);background:#fff;font-variant-numeric:tabular-nums}
.otp input:focus{border-color:var(--p-brand);outline:3px solid #0B5CAD;outline-offset:1px}
.otp[aria-invalid="true"] input{border-color:var(--p-err-ink)}

/* progresso */
.prog{display:flex;flex-direction:column;gap:.35em;font-size:.88em;color:var(--p-muted)}
.bar{height:.5em;border-radius:1em;background:#DCE5EA;overflow:hidden}
.bar i{display:block;height:100%;width:50%;background:var(--p-brand);border-radius:1em}

/* carinhas */
fieldset.faces{border:0;padding:0;margin:0}
fieldset.faces legend{padding:0;font-size:.95em;color:var(--p-muted);margin-bottom:.5em}
.face-row{display:grid;grid-template-columns:repeat(5,1fr);gap:.35em}
.face{position:relative}
.face input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.face label{display:flex;flex-direction:column;align-items:center;gap:.3em;padding:.45em .1em;border:2px solid transparent;border-radius:.6em;font-size:.72em;text-align:center;line-height:1.15;min-height:5.6em;cursor:pointer}
.face svg{width:2.4em;height:2.4em}
.face input:checked + label{border-color:var(--p-brand);background:var(--p-brand-soft);font-weight:700}
.face input:focus-visible + label{outline:3px solid #0B5CAD;outline-offset:1px}
.scale{display:grid;grid-template-columns:repeat(6,1fr);gap:.35em}
.scale label{display:flex;align-items:center;justify-content:center;min-height:2.75em;border:2px solid var(--p-line);border-radius:.5em;font-weight:700;cursor:pointer;position:relative;font-variant-numeric:tabular-nums}
.scale input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.scale label:has(input:checked){background:var(--p-brand);border-color:var(--p-brand);color:#fff}
.scale label:has(input:focus-visible){outline:3px solid #0B5CAD;outline-offset:1px}
.field{display:flex;flex-direction:column;gap:.35em}
.field label{font-size:.95em}
.field textarea{font:inherit;min-height:4.6em;border:2px solid var(--p-line);border-radius:.6em;padding:.6em;resize:vertical;color:var(--p-ink);background:#fff}
.hint{font-size:.82em;color:var(--p-muted)}

/* fila */
.est{border:2px solid #8CC7A5;background:var(--p-ok-bg);color:var(--p-ok-ink);border-radius:.6em;padding:.7em .9em}
.est strong{font-size:1.15em;display:block}
.est span{font-size:.8em}
h3.sub{font-size:.95em;margin:.2em 0 0}
ol.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.55em;counter-reset:s}
ol.steps li{display:flex;gap:.6em;align-items:flex-start;font-size:.93em;line-height:1.35;counter-increment:s}
ol.steps li::before{content:counter(s);flex:none;width:1.55em;height:1.55em;border-radius:50%;background:var(--p-brand);color:#fff;font-size:.82em;font-weight:700;display:grid;place-items:center;margin-top:.05em}
.check{display:flex;align-items:center;gap:.7em;border:1px solid #B5C4CC;border-radius:.6em;padding:.65em .8em;min-height:3em;cursor:pointer;font-size:.93em}
.check input{width:1.35em;height:1.35em;accent-color:var(--p-brand);flex:none;margin:0}

/* consulta */
.doc{display:flex;gap:.8em;align-items:center;background:var(--p-brand-soft);border-radius:.7em;padding:.8em}
.avatar{width:3.2em;height:3.2em;border-radius:50%;background:#B9D3E0;display:grid;place-items:center;flex:none}
.avatar i{width:1em;height:1em;border-radius:50%;background:var(--p-brand)}
.doc strong{display:block}.doc span{font-size:.82em;color:var(--p-muted)}
.toggle{display:flex;align-items:center;gap:.7em;width:100%;font:inherit;font-size:.93em;text-align:left;border:1px solid #B5C4CC;border-radius:.6em;background:#fff;color:var(--p-ink);padding:.6em .8em;min-height:3em;cursor:pointer}
.toggle svg{width:1.2em;height:1.2em;flex:none;color:var(--p-muted)}
.toggle .state{margin-left:auto;font-size:.8em;font-weight:700;padding:.15em .6em;border-radius:1em;background:#E7EDF0;color:var(--p-muted)}
.toggle[aria-pressed="true"] .state{background:var(--p-brand);color:#fff}

/* camadas modais */
.sheet-back{position:absolute;inset:0;background:rgba(14,26,33,.55);display:flex;align-items:flex-end;z-index:5}
.sheet{background:#fff;width:100%;border-radius:1.2em 1.2em 0 0;padding:1.3em 1.25em 1.4em;display:flex;flex-direction:column;gap:.8em}
.sheet h2{font-size:1.35em;margin:0}
.sheet h2:focus{outline:none}
.chips{display:flex;flex-wrap:wrap;gap:.45em}
.chip{font:inherit;font-size:.88em;border:1px solid var(--p-brand);color:var(--p-brand);background:#fff;border-radius:2em;padding:.45em .85em;min-height:2.75em;cursor:pointer}
.answer{font-size:.92em;background:var(--p-brand-soft);border-radius:.6em;padding:.7em .85em;color:#1E4F69}

/* antes */
.before .bad-cap{color:#C2392D;font-size:.82em;text-align:center;font-weight:700;margin-top:auto}
.b-otp{display:grid;grid-template-columns:repeat(6,1fr);gap:.4em}
.b-otp span{border:2px solid #222;border-radius:.4em;height:2.8em;display:grid;place-items:center;font-weight:700;font-size:1.2em}
.b-timer{color:#C2392D;font-size:1.6em;font-weight:700;text-align:center}
.b-in{border:1.5px solid #555;border-radius:.4em;height:2.4em;padding:.4em .6em;font-size:.9em}
.b-scale{display:flex;gap:2px}.b-scale span{border:1px solid #888;font-size:.6em;padding:.25em .3em;border-radius:2px}
.b-small{font-size:.8em}
.barrier{display:inline-grid;place-items:center;width:1.5em;height:1.5em;border-radius:50%;background:#C2392D;color:#fff;font-size:.68em;font-weight:700;vertical-align:middle;margin-left:.3em;font-family:var(--mono)}

/* ===== notas ===== */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:18px;min-width:0}
.panel h2{margin:0;font-size:1.3rem;line-height:1.25}
.panel .lead{margin:0;color:var(--muted);max-width:65ch}
.cols{display:grid;grid-template-columns:1fr;gap:18px}
.panel h3{margin:0 0 8px;font-size:.8rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
ul.barriers{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
ul.barriers li{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--bad-soft)}
ul.barriers li b{flex:none;font-family:var(--mono);font-size:.8rem;color:var(--surface);background:var(--bad);width:1.7rem;height:1.7rem;border-radius:50%;display:grid;place-items:center}
table.crit{width:100%;border-collapse:collapse;font-size:.95rem}
table.crit th,table.crit td{text-align:left;vertical-align:top;padding:10px 8px;border-top:1px solid var(--line)}
table.crit th{font-weight:400}
.code{font-family:var(--mono);font-size:.82rem;white-space:nowrap}
.lvl{display:inline-block;font-family:var(--mono);font-size:.72rem;padding:1px 6px;border-radius:5px;border:1px solid var(--line);color:var(--muted);margin-top:4px}
.crit .name{font-weight:700;display:block}
.demo{display:flex;flex-wrap:wrap;gap:8px}
.demo button{font:inherit;font-size:.92rem;min-height:44px;padding:8px 14px;border-radius:10px;border:1px dashed var(--accent);background:var(--accent-soft);color:var(--ink);cursor:pointer}
.table-wrap{overflow-x:auto}
footer{color:var(--muted);font-size:.9rem;max-width:80ch}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:no-preference){.screen{animation:in .25s ease-out}@keyframes in{from{opacity:.4;transform:translateY(6px)}}}
</style>

<a class="skip" href="#app">Pular para o protótipo</a>
<div class="wrap">
  <h1 class="sr">SaúdeConecta</h1>
  <nav class="flow" aria-label="Etapas do fluxo">
    <ol id="tabs"></ol>
  </nav>

  <div class="stage">
    <div class="phone" id="app" aria-label="Tela do aplicativo SaúdeConecta" role="region"></div>
  </div>
</div>

<script>
(function(){
const $ = (s,r=document)=>r.querySelector(s);
const app = $('#app'), notes = $('#notes');
const ico = {
  clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  save:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 4h11l3 3v13H5z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/></svg>',
  alert:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17h.01"/></svg>',
  pause:'<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>',
  chat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>',
  cam:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="7" width="12" height="10" rx="2"/><path d="m15 11 6-3v8l-6-3"/></svg>',
  mic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
  vol:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9a4 4 0 0 1 0 6"/></svg>',
  ok:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>'
};
const faceSvg=(fill,mouth,brow='')=>`<svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="${fill}" stroke="#00000033"/><circle cx="14" cy="17" r="2" fill="#2A2A2A"/><circle cx="26" cy="17" r="2" fill="#2A2A2A"/>${brow}<path d="${mouth}" stroke="#2A2A2A" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg>`;
const faces=[
  {v:'bem',t:'Bem',s:faceSvg('#9ED8AE','M13 24q7 7 14 0')},
  {v:'mais-ou-menos',t:'Mais ou menos',s:faceSvg('#F2DE8A','M13 26h14')},
  {v:'incomodado',t:'Incomodado',s:faceSvg('#F4C28A','M13 28q7-5 14 0')},
  {v:'doi',t:'Dói',s:faceSvg('#F2A792','M13 29q7-7 14 0','<path d="M10 12l6 2M30 12l-6 2" stroke="#2A2A2A" stroke-width="2" stroke-linecap="round"/>')},
  {v:'doi-muito',t:'Dói muito',s:faceSvg('#E8807A','M12 30q8-9 16 0','<path d="M9 11l7 3M31 11l-7 3" stroke="#2A2A2A" stroke-width="2.4" stroke-linecap="round"/>')}
];

const S = { i:0, mode:'depois', fs:16, numeric:false, feeling:'mais-ou-menos', pain:null, code:['','','','','',''],
  cam:false, mic:false, vol:0, text:false, turn:false, sessionWarn:false, otpError:'' , inCall:false};
const VOLS=['baixo','médio','alto'];

const SCREENS = [
  {key:'entrar', tab:'Entrar',
   title:'Entrar com código por SMS',
   lead:'A verificação antiga combinava contagem regressiva vermelha, erro genérico e espera para reenviar. A proposta tira a pressão de tempo e oferece caminhos alternativos.',
   antes:['Contagem regressiva em vermelho e grande cria pressão e ansiedade.','Erro "Código inválido" não diz o que fazer e o tempo continua correndo.','Reenvio bloqueado por 30 s e em texto cinza de baixo contraste.','Só existe um canal (SMS); quem não recebe fica sem saída.'],
   crit:[
    ['2.2.1','Ajustável por temporização','A','O código vale 10 minutos e o prazo é dito em texto calmo, sem relógio contando. A Pausa congela o tempo.'],
    ['3.3.8','Autenticação acessível (mínima)','AA','Colar o código é permitido, e o primeiro campo usa autocomplete="one-time-code", que preenche direto do SMS.'],
    ['1.3.5','Identificar o propósito de entrada','AA','Campos marcados como código de uso único e teclado numérico.'],
    ['3.3.1 / 3.3.3','Identificação e sugestão de erro','A / AA','A mensagem diz o que houve e como resolver. Os números digitados continuam nos campos.'],
    ['1.4.1','Utilização de cores','A','Estados não dependem só de cor: há ícone e texto.'],
    ['3.2.6','Ajuda consistente','A','"Ajuda por texto" fica no mesmo lugar em todas as telas.']],
   demo:[['Simular código errado',()=>{S.otpError='Esse código não confere com o que enviamos. Seus números continuam aqui: confira e tente de novo, ou peça um novo código.';render();focusSel('#otp-err')}]]
  },
  {key:'anamnese', tab:'Anamnese',
   title:'Contar como está se sentindo',
   lead:'O formulário antigo pedia tudo de uma vez e apagava 18 campos quando a sessão expirava. A proposta divide em passos curtos, salva sozinha e avisa antes do tempo acabar.',
   antes:['Formulário longo numa tela só, sem indicação de progresso.','Escala de dor 0–10 com alvos minúsculos (cerca de 16 px).','Limite de 500 caracteres e separador ";" exigem regras de memória.','Sessão expira sem aviso e apaga 18 campos preenchidos.'],
   crit:[
    ['2.2.6','Tempos limite','AAA','Diz quanto dura a sessão e avisa 5 minutos antes, com opção de estender.'],

function render(){
  renderTabs();
  scheduleTurn();
  const views=[vEntrar,vAnamnese,vFila,vConsulta];
  app.classList.toggle('dark-before', S.mode==='antes' && S.i===3);
  app.innerHTML = (S.mode==='antes' && S.i===3 ? `<div class="status" aria-hidden="true" style="color:#fff"><span>9:41</span><span>5G 100%</span></div>` : head())
    + (S.mode==='antes'? bAntes() : views[S.i]())
    + `<div id="live" class="sr" role="status" aria-live="polite"></div>`;
  app.setAttribute('aria-label', S.mode==='antes'?'Tela antiga, com barreiras numeradas':'Tela proposta do aplicativo SaúdeConecta');
  if(S.mode==='antes') app.querySelectorAll('.screen.before *').forEach(()=>{});
  wire();
}

function go(i,focus=true){ S.i=i; S.otpError=''; render(); if(focus) focusSel('#app h2'); }

function wire(){
  // OTP
  const ins=[...app.querySelectorAll('.otp input')];
  ins.forEach((el,i)=>{
    el.addEventListener('input',()=>{
      const d=el.value.replace(/\D/g,'');
      if(d.length>1){fill(d,i);return}
      el.value=d; S.code[i]=d;
      if(d && ins[i+1]) ins[i+1].focus();
    });
    el.addEventListener('keydown',e=>{
      if(e.key==='Backspace' && !el.value && ins[i-1]){ins[i-1].focus();ins[i-1].value='';S.code[i-1]='';e.preventDefault()}
      if(e.key==='ArrowLeft'&&ins[i-1]){ins[i-1].focus();e.preventDefault()}
      if(e.key==='ArrowRight'&&ins[i+1]){ins[i+1].focus();e.preventDefault()}
    });
    el.addEventListener('paste',e=>{const t=(e.clipboardData||window.clipboardData).getData('text');const d=t.replace(/\D/g,'');if(d){e.preventDefault();fill(d,i)}});
  });
  function fill(d,start){d.slice(0,6-start).split('').forEach((c,k)=>{ins[start+k].value=c;S.code[start+k]=c});const nx=ins[Math.min(start+d.length,5)];nx.focus();say(`${S.code.filter(Boolean).length} de 6 números preenchidos.`)}

  const fo=$('#f-otp',app);
  if(fo) fo.addEventListener('submit',e=>{e.preventDefault();
    const miss=S.code.filter(c=>!c).length;
    if(miss){S.otpError=`Faltam ${miss} ${miss>1?'números':'número'}. Complete o código de 6 números que chegou por SMS.`;render();const first=S.code.findIndex(c=>!c);focusSel('#otp'+first);say(S.otpError);return}
    S.otpError='';go(1);});
  const fa=$('#f-ana',app);
  if(fa){
    fa.addEventListener('submit',e=>{e.preventDefault();go(2)});
    fa.addEventListener('change',e=>{if(e.target.name==='feel')S.feeling=e.target.value;if(e.target.name==='pain')S.pain=+e.target.value;draft()});
    $('#sint',app).addEventListener('input',debounce(draft,800));
  }
  app.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click',()=>act(b.dataset.act,b)));
}
function draft(){const d=$('#draft span',app);if(!d)return;const t=new Date();d.textContent=`Rascunho salvo às ${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}. Você pode sair e voltar.`}
function debounce(f,ms){let t;return()=>{clearTimeout(t);t=setTimeout(f,ms)}}

async function act(a,btn){
  switch(a){
    case 'paste':{
      let txt='';
      try{ txt = await navigator.clipboard.readText(); }catch(e){}
      const d=(txt||'').replace(/\D/g,'').slice(0,6);
      if(d.length){d.split('').forEach((c,k)=>S.code[k]=c);S.otpError='';render();focusSel('#otp'+Math.min(d.length,5));say('Código colado.')}
      else{focusSel('#otp0');say('Toque e segure no primeiro quadrado e escolha Colar. O código é distribuído sozinho.')}
      break}
    case 'resend': say('Enviamos um novo código por SMS. O anterior deixou de valer.'); toastNote('Novo código enviado por SMS. Ele vale 10 minutos.'); break;
    case 'email': toastNote('Enviamos o código para j•••@gmail.com. Pode levar até 1 minuto.'); break;
    case 'numeric': S.numeric=!S.numeric; render(); focusSel(S.numeric?'#app .scale input':'#app .face input'); break;
    case 'extend': S.sessionWarn=false; render(); toastNote('Pronto: mais 30 minutos de sessão.',true); break;
    case 'close': toastNote('Combinado. Você pode fechar o app; avisaremos'+($('#c-sil',app)?.checked?' com notificação silenciosa.':' com notificação.'),true); break;
    case 'later': S.turn=false; render(); toastNote('Você passou para depois do próximo paciente. Seu lugar continua garantido.',true); break;
    case 'toConsulta': go(3); break;
    case 'cam': S.cam=!S.cam; render(); focusSel('[data-act="cam"]'); say('Câmera '+(S.cam?'ligada':'desligada')); break;
    case 'mic': S.mic=!S.mic; render(); focusSel('[data-act="mic"]'); say('Microfone '+(S.mic?'ligado':'desligado')); break;
    case 'vol': S.vol=(S.vol+1)%3; render(); focusSel('[data-act="vol"]'); say('Som de entrada '+VOLS[S.vol]); break;
    case 'text': S.text=!S.text; render(); focusSel('[data-act="text"]'); break;
    case 'enter': S.inCall=true; render(); focusSel('#app h2'); break;
    case 'restart': Object.assign(S,{code:['','','','','',''],cam:false,mic:false,vol:0,text:false,turn:false,inCall:false,sessionWarn:false,numeric:false}); go(0); break;
    case 'pause': openSheet('pause',btn); break;
    case 'help': openSheet('help',btn); break;
  }
}
function toastNote(msg,ok){
  const scr=$('.screen',app); const old=$('#toast',app); if(old) old.remove();
  const d=document.createElement('div'); d.id='toast'; d.className='note '+(ok?'ok':'info'); d.setAttribute('role','status');
  d.innerHTML=ico.ok+'<span></span>'; d.querySelector('span').textContent=msg;
  const h=$('h2',scr); h.insertAdjacentElement('afterend',d);
}

function scheduleTurn(){
  clearTimeout(S.qt);
  if(S.i===2 && !S.turn && !S.paused) S.qt=setTimeout(()=>{ if(S.i===2 && !S.paused && !$('.sheet-back',app)){S.turn=true;render();focusSel('#app h2')} },9000);
}
let lastFocus=null;
function openSheet(kind,opener){
  lastFocus=opener;
  if(kind==='pause'){S.paused=true;clearTimeout(S.qt)}
  const back=document.createElement('div'); back.className='sheet-back';
  const body = kind==='pause'
   ? `<h2 id="sh-t" tabindex="-1">Pausado</h2><p>Nada vai expirar enquanto você estiver aqui. Seu lugar e suas respostas estão guardados.</p><p class="muted" style="font-size:.9em">Respire, beba uma água. Volte quando quiser.</p><button type="button" class="btn primary" data-close>Continuar de onde parei</button>`
   : `<h2 id="sh-t" tabindex="-1">Ajuda por texto</h2><p class="muted" style="font-size:.92em">Escolha uma dúvida ou escreva a sua. Uma pessoa da equipe responde aqui.</p>
      <div class="chips"><button type="button" class="chip" data-q="0">Não recebi o código</button><button type="button" class="chip" data-q="1">Posso usar só texto?</button><button type="button" class="chip" data-q="2">Quanto tempo vai demorar?</button></div>
      <div class="answer" id="ans" role="status" hidden></div>
      <div class="field"><label for="hq">Sua dúvida</label><textarea id="hq"></textarea></div>
      <div class="dock" style="padding-top:0"><button type="button" class="btn ghost" data-close>Fechar</button><button type="button" class="btn primary" data-send>Enviar</button></div>`;
  back.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t">${body}</div>`;
  app.appendChild(back);
  [...app.children].forEach(c=>{if(c!==back&&c.id!=='live')c.setAttribute('inert','')});
  $('#sh-t',back).focus();
  const A=['Toque em "Receber por e-mail" na tela de entrada, ou peça um novo código. O código vale 10 minutos.','Sim. Na tela antes da consulta, toque em "Prefiro responder por texto". A médica recebe suas respostas escritas.','A estimativa aparece na fila e é atualizada a cada 30 segundos. Você pode fechar o app; avisamos quando for sua vez.'];
  back.addEventListener('click',e=>{
    const q=e.target.closest('[data-q]'); if(q){const an=$('#ans',back);an.hidden=false;an.textContent=A[+q.dataset.q];}
    if(e.target.closest('[data-send]')){const an=$('#ans',back),v=$('#hq',back).value.trim();an.hidden=false;an.textContent=v?'Mensagem enviada. A equipe costuma responder em até 2 minutos (demonstração).':'Escreva sua dúvida no campo acima antes de enviar.';if(v)$('#hq',back).value=''}
    if(e.target.closest('[data-close]')||e.target===back) close();
  });
  back.addEventListener('keydown',e=>{
    if(e.key==='Escape') close();
    if(e.key==='Tab'){const f=[...back.querySelectorAll('button,textarea')].filter(x=>!x.hidden);const first=f[0],last=f[f.length-1];
      if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault()}else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault()}}
  });
  function close(){back.remove();S.paused=false;scheduleTurn();[...app.children].forEach(c=>c.removeAttribute('inert'));if(lastFocus&&lastFocus.isConnected)lastFocus.focus();}
}

document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]'); if(g){go(+g.dataset.go);}
  const d=e.target.closest('[data-demo]'); if(d){S.mode='depois';syncMode();SCREENS[S.i].demo[+d.dataset.demo][1]();}
  const f=e.target.closest('[data-fs]'); if(f){S.fs=+f.dataset.fs;app.style.setProperty('--fs',S.fs+'px');document.querySelectorAll('[data-fs]').forEach(b=>b.setAttribute('aria-pressed',String(b===f)))}
});
function syncMode(){$('#v-depois').setAttribute('aria-pressed',String(S.mode==='depois'));$('#v-antes').setAttribute('aria-pressed',String(S.mode==='antes'));}
render();
})();
</script>
